[package]
name = "moncap-gps"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
# Features ciblées (au lieu de "full") : évite de compiler fs/process/signal/
# io-std inutiles ici → build plus léger et binaire un peu plus petit.
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "sync", "time", "net", "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "compression-br", "catch-panic"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = "0.1"
rayon = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
jsonwebtoken = "9"
# Pont pub/sub multi-instances (optionnel : activé si REDIS_URL est défini).
# rustls + insecure : Heroku Redis impose TLS avec certificat auto-signé.
redis = { version = "0.32", features = ["tokio-rustls-comp", "tls-rustls-insecure"] }
futures-util = "0.3"
# Client HTTP sortant (rustls, sans OpenSSL) : sert à interroger l'API NASA
# FIRMS côté serveur pour ne pas exposer la clé aux clients.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Décompression des répertoires PMTiles (gzip), pour les cartes hors ligne
# servies depuis une archive auto-hébergée.
flate2 = "1"
# Empreinte des jetons de réinitialisation : le jeton envoyé par courriel
# n'est jamais stocké, seulement son SHA-256.
sha2 = "0.10"
# Envoi des courriels de réinitialisation via le SMTP configuré (SMTP_HOST…).
# rustls comme partout : pas d'OpenSSL sur le dyno.
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool",
] }

[dev-dependencies]
# `oneshot` pour tester les handlers Axum sans ouvrir de port réseau.
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "moncap-gps"
path = "src/main.rs"

# Binaire de production : symboles retirés + optimisations d'édition de liens.
# LTO « thin » (bon compromis perf / temps de build, contrairement au « fat »
# qui risquerait de dépasser la limite de build des buildpacks Heroku) et une
# seule unité de codegen pour un meilleur inlining. opt-level 3 est déjà le
# défaut en release.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
