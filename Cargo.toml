[package]
name = "moncap-gps"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# Le framework : serveur (vitesse), bouclier de sécurité (securite), base de
# données (memoire-orm), le tout derrière une seule `App`. Seul Postgres est
# compilé : c'est la base de production et celle des tests.
paquets = { git = "https://github.com/maxlestage/Paquets", default-features = false, features = ["postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Connexion : Argon2 pour les mots de passe, SHA-256 pour ne stocker que
# l'empreinte des jetons (sessions et réinitialisations), et jsonwebtoken
# pour continuer d'accepter les anciens jetons JWT pendant la transition.
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
jsonwebtoken = "9"

# Pont pub/sub multi-instances (optionnel : activé si REDIS_URL est défini).
# rustls + insecure : Heroku Redis impose TLS avec certificat auto-signé.
redis = { version = "0.27", features = ["tokio-rustls-comp", "tls-rustls-insecure"] }
futures-util = "0.3"
# Client HTTP sortant (rustls, sans OpenSSL) : FIRMS, Open-Meteo, Transitous,
# TomTom, tuiles et archives PMTiles, GitHub.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Décompression des répertoires PMTiles (gzip).
flate2 = "1"
# Envoi des courriels de réinitialisation via le SMTP configuré (SMTP_HOST…).
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool",
] }

[[bin]]
name = "moncap-gps"
path = "src/main.rs"

# Binaire de production : symboles retirés + optimisations d'édition de liens.
# LTO « thin » : bon compromis avec la limite de build du buildpack Heroku.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
