[package]
name = "moncap-gps"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# Le framework : serveur (vitesse), bouclier de sécurité (securite), base de
# données (memoire-orm), le tout derrière une seule `App`. Seul SQLite est
# compilé, dans le binaire : ni serveur de base à faire tourner, ni Redis. Les
# données et le cache sont deux fichiers (voir `base` et `cache`).
paquets = { git = "https://github.com/maxlestage/Paquets", default-features = false, features = ["sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Connexion : Argon2 pour les mots de passe, SHA-256 pour ne stocker que
# l'empreinte des jetons (sessions et réinitialisations).
argon2 = "0.6"
sha2 = "0.11"
# L'aléa des jetons (sessions, liens, identifiants de connexion).
getrandom = "0.4"
# Client HTTP sortant (rustls, sans OpenSSL) : FIRMS, Open-Meteo, Transitous,
# TomTom, tuiles et archives PMTiles, GitHub.
# rustls sur `ring`, comme le reste du serveur (securite, lettre) : le
# fournisseur par défaut de reqwest 0.13, aws-lc, ajouterait une compilation
# C lourde au buildpack. Installé avant le premier client (`externes`).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Décompression des répertoires PMTiles (gzip).
flate2 = "1"
# Envoi des courriels de réinitialisation via le SMTP configuré (SMTP_HOST…).
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool",
] }

[[bin]]
name = "moncap-gps"
path = "src/main.rs"

# Binaire de production : symboles retirés + optimisations d'édition de liens.
# LTO « thin » : bon compromis avec la limite de build du buildpack Heroku.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
