<noscript><div class="dedans repli"><h1>Comparez, puis roulez avec ou sans réseau</h1><p>Un GPS pour iPhone qui met les itinéraires côte à côte — durée, virages, dénivelé, carburant, péages — puis vous guide. Téléchargez votre région une fois, et il continue de calculer tout seul : vallées, tunnels, étranger.</p><p><a href="/app">Se connecter</a></p><h2>Le trajet vous est présenté, pas imposé</h2><h2>Puis il vous emmène</h2><h2>Quand le réseau tombe</h2><p>Jusqu'à 15 itinéraires côte à côte, chacun étiqueté le plus simple, le plus rapide ou le plus court. Pour chacun : la durée, la distance, le nombre de virages, l'heure d'arrivée, le dénivelé — et ce que ça coûte.</p><p>La flèche suit la manœuvre réelle, la distance au prochain virage se met à jour, et le numéro de sortie s'affiche sous la consigne. À l'approche d'une intersection, les voies à prendre s'allument. La vitesse du moment est comparée à la limite de la route, lue sur OpenStreetMap : elle passe au rouge quand vous la dépassez. En bas, l'heure d'arrivée vit à côté des minutes restantes, et les commandes de la carte tiennent dans un seul panneau — dégagé de tout ce qui ne sert pas au volant.</p><p>212 régions dans 49 pays d'Europe, téléchargeables une par une. Plusieurs peuvent cohabiter sur le téléphone, et le transfert d'un paquet ne demande pas de rester devant l'écran.</p><h2>Le prix, dit simplement</h2><p>MonCap Plus — 3,99 € par mois, sans engagement</p><p>MonCap Pro — 9,99 € par mois, pour ceux qui roulent pour travailler</p><p><span aria-current="true">Français</span> <a href="/es" hreflang="es">Español</a> <a href="/en" hreflang="en">English</a> <a href="/mentions-legales">Mentions légales</a> <a href="/confidentialite">Confidentialité</a></p><p>Conçu et développé par <a href="https://moncap-c41a5aaf07e8.herokuapp.com/">Maxime Nathan Lestage</a></p></div></noscript>
