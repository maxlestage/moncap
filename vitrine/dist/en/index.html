<noscript><div class="dedans repli"><h1>Compare, then drive with or without signal</h1><p>An iPhone GPS that lays the routes side by side — time, turns, elevation, fuel, tolls — then guides you. Download your region once and it keeps computing on its own: valleys, tunnels, abroad.</p><p><a href="/app">Sign in</a></p><h2>The route is offered, not imposed</h2><h2>Then it takes you there</h2><h2>When the signal drops</h2><p>Up to 15 routes side by side, each labelled the simplest, the fastest or the shortest. For every one: time, distance, number of turns, arrival time, elevation — and what it costs.</p><p>The arrow follows the actual manoeuvre, the distance to the next turn updates, and the exit number appears under the instruction. Coming up to a junction, the lanes to take light up. Your current speed is compared with the road's limit, read from OpenStreetMap: it turns red when you go over. At the bottom, the arrival time lives next to the minutes left, and the map controls fit in a single panel — cleared of everything that's no use at the wheel.</p><p>212 regions across 49 European countries, downloadable one by one. Several can live on the phone at once, and transferring a pack doesn't mean sitting in front of the screen.</p><h2>The price, said plainly</h2><p>MonCap Plus — 3.99 € per month, cancel anytime</p><p>MonCap Pro — 9.99 € per month, for people who drive for a living</p><p><a href="/" hreflang="fr">Français</a> <a href="/es" hreflang="es">Español</a> <span aria-current="true">English</span> <a href="/en/legal">Legal notice</a> <a href="/en/privacy">Privacy</a></p><p>Designed and built by <a href="https://moncap-c41a5aaf07e8.herokuapp.com/en">Maxime Nathan Lestage</a></p></div></noscript>
