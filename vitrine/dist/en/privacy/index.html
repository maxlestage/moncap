<noscript><div class="dedans juridique repli"><h1>Privacy</h1><h2>This site</h2><p>This site sets no cookies, loads no scripts, and carries no trackers or analytics. The only requests your browser sends are the ones needed to display the page.</p><h2>The account</h2><p>The app works with an account: your email address is your login, along with a password (stored hashed) and your recent destination searches. The address is used for nothing else: no mail apart from the password reset you ask for, no newsletter, no resale. Deleting the account deletes everything, address included.</p><h2>Your position</h2><p>Your position is processed on the device for guidance. It is only sent to the server while you share your trip live, for the duration of that share. The Home and Work favourites stay on the phone.</p><h2>Third parties</h2><p>Some of the data shown is requested directly from its sources — weather, air quality, elevation. Those services then receive the coordinates of the requested area, never your identity or your account.</p><h2>Advertising</h2><p>No advertising, no resale of data, no analytics. The app does not live off your data.</p><h2>Your rights</h2><p>You can request access to, correction of, or deletion of what is attached to your account by writing to maxlestage@icloud.com. Deleting the account deletes its data.</p></div></noscript>
