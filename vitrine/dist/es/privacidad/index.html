<noscript><div class="dedans juridique repli"><h1>Privacidad</h1><h2>Este sitio</h2><p>Este sitio no deposita ninguna cookie, no carga ningún script, no lleva rastreadores ni medición de audiencia. Las únicas peticiones que envía tu navegador sirven para mostrar la página.</p><h2>La cuenta</h2><p>La aplicación funciona con una cuenta: tu dirección de correo sirve de identificador, junto con una contraseña (guardada con hash) y tus búsquedas recientes de destino. La dirección no sirve para nada más: ningún correo salvo la recuperación de contraseña que tú pidas, ningún boletín, ninguna reventa. Eliminar la cuenta lo elimina todo, dirección incluida.</p><h2>La posición</h2><p>Tu posición se procesa en el dispositivo para la guía. Solo se envía al servidor cuando compartes tu trayecto en directo, mientras dura ese compartir. Los favoritos Casa y Trabajo se quedan en el teléfono.</p><h2>Los terceros</h2><p>Algunos datos mostrados se piden directamente a sus fuentes — meteorología, calidad del aire, altitud. Esos servicios reciben entonces las coordenadas de la zona pedida, nunca tu identidad ni tu cuenta.</p><h2>Publicidad</h2><p>Ninguna publicidad, ninguna reventa de datos, ninguna medición de audiencia. La aplicación no vive de tus datos.</p><h2>Tus derechos</h2><p>Puedes pedir el acceso, la rectificación o la supresión de lo que está vinculado a tu cuenta escribiendo a maxlestage@icloud.com. La supresión de la cuenta conlleva la de sus datos.</p></div></noscript>
