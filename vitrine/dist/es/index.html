<noscript><div class="dedans repli"><h1>Compara y conduce con o sin cobertura</h1><p>Un GPS para iPhone que pone las rutas una al lado de otra — duración, giros, desnivel, combustible, peajes — y luego te guía. Descarga tu región una vez y sigue calculando solo: valles, túneles, extranjero.</p><h2>La ruta se te propone, no se te impone</h2><h2>Y luego te lleva</h2><h2>Cuando se cae la cobertura</h2><p>Hasta 15 rutas una al lado de otra, cada una etiquetada como la más sencilla, la más rápida o la más corta. Para cada una: la duración, la distancia, el número de giros, la hora de llegada, el desnivel — y lo que cuesta.</p><p>La flecha sigue la maniobra real, la distancia al siguiente giro se actualiza, y el número de salida aparece bajo la indicación. Al acercarse a un cruce, los carriles a tomar se iluminan. La velocidad del momento se compara con el límite de la vía, leído en OpenStreetMap: se pone en rojo cuando lo superas. Abajo, la hora de llegada vive junto a los minutos restantes, y los mandos del mapa caben en un solo panel — despejado de todo lo que no sirve al volante.</p><p>212 regiones en 49 países de Europa, descargables una a una. Varias pueden convivir en el teléfono, y la transferencia de un paquete no exige quedarse delante de la pantalla.</p><h2>El precio, dicho claro</h2><p>MonCap Plus — 3,99 € al mes, sin permanencia</p><p>MonCap Pro — 9,99 € al mes, para quienes conducen por trabajo</p><p><a href="/" hreflang="fr">Français</a> <a href="/en" hreflang="en">English</a> <a href="/es/aviso-legal">Aviso legal</a> <a href="/es/privacidad">Privacidad</a></p><p>Diseñado y desarrollado por <a href="https://moncap-c41a5aaf07e8.herokuapp.com/es">Maxime Nathan Lestage</a></p></div></noscript>
