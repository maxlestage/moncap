<noscript><div class="dedans juridique repli"><h1>Confidentialité</h1><h2>Ce site</h2><p>Ce site ne dépose aucun cookie, ne charge aucun script, n'embarque ni traceur ni mesure d'audience. Les seules requêtes que votre navigateur envoie servent à afficher la page.</p><h2>Le compte</h2><p>L'application fonctionne avec un compte : votre adresse e-mail sert d'identifiant, accompagnée d'un mot de passe (conservé haché) et de vos recherches récentes de destination. L'adresse ne sert à rien d'autre : aucun courriel en dehors de la réinitialisation de mot de passe que vous demandez, aucune lettre d'information, aucune revente. Supprimer le compte supprime tout, l'adresse comprise.</p><h2>La position</h2><p>Votre position est traitée sur l'appareil pour le guidage. Elle n'est envoyée au serveur que lorsque vous partagez votre trajet en direct, le temps de ce partage. Les favoris Domicile et Travail restent sur le téléphone.</p><h2>Les tiers</h2><p>Certaines données affichées sont demandées directement à leurs sources — météo, qualité de l'air, altitude. Ces services reçoivent alors les coordonnées de la zone demandée, jamais votre identité ni votre compte.</p><h2>Publicité</h2><p>Aucune publicité, aucune revente de données, aucune mesure d'audience. L'application ne vit pas de vos données.</p><h2>Vos droits</h2><p>Vous pouvez demander l'accès, la rectification ou la suppression de ce qui est rattaché à votre compte en écrivant à maxlestage@icloud.com. La suppression du compte emporte celle de ses données.</p></div></noscript>
