# La vitrine, en Rust de bout en bout.
#
# `[workspace]` vide et volontaire : cette crate ne fait pas partie du paquet
# du serveur, à la racine. Sans cette ligne, cargo croit qu'elle y appartient
# et refuse de la construire.
[package]
name = "vitrine"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# Deux cibles pour une seule base de code, et c'est tout l'intérêt d'avoir
# choisi Rust : le contenu, les types et les composants se compilent
#   - en WebAssembly pour l'application qui tourne dans le navigateur,
#   - en binaire natif pour l'outil qui fabrique les coquilles HTML (titres,
#     Open Graph, JSON-LD, repli sans script).
# Le texte des trois langues n'existe donc qu'une fois, et le compilateur
# garantit que les deux usages voient exactement le même.
[lib]
name = "vitrine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "construit"
path = "src/bin/construit.rs"

[[bin]]
name = "app"
path = "src/bin/app.rs"

[dependencies]
# Le front de la famille Paquets : `active`, par sa réexportation. Les vues
# sont des fonctions qui rendent un `Node` — rendu en HTML à la construction
# par `construit`, réhydraté dans le navigateur pour ses seuls îlots. Sans les
# fonctionnalités par défaut (bases de données) : seul le côté navigateur
# (`client`) sert ici. La même ligne vaut pour les deux cibles : en natif,
# `client` ne fait que compiler du code qui ne s'exécute jamais.
paquets = { git = "https://github.com/maxlestage/Paquets", default-features = false, features = ["client"] }

# Le mouvement de zamocorp.com, en Rust : partagé avec le front web.
mouvement = { path = "../mouvement" }
# Les outils de `construit` (empreintes, feuille, chaîne WebAssembly),
# partagés avec le front web. Natifs : rien n'en part au navigateur.
fabrique = { path = "../fabrique" }

# Le navigateur, vu depuis Rust. Les fonctionnalités sont énumérées une par
# une et non prises en bloc : `web-sys` est immense, et chaque interface non
# demandée est du code qui ne part pas dans le WebAssembly.
# Verrouillée à la version du front web : la CI refuse deux fronts qui
# divergent, l'outil `wasm-bindgen` installé ne pouvant en servir qu'une.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document", "Element", "HtmlElement", "HtmlCollection", "NodeList",
    "Window", "DomRect", "DomStringMap", "CssStyleDeclaration",
    "ScrollToOptions", "ScrollBehavior", "ScrollIntoViewOptions",
    "MediaQueryList", "Event", "EventTarget", "AddEventListenerOptions",
]

[profile.release]
# `z` plutôt que `s` : sur une page qui ne calcule rien, chaque kilooctet
# économisé arrive plus tôt que ce qu'une optimisation de vitesse ferait
# gagner à l'exécution.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
