# Le serveur, avec sa base locale (le mode local de Nuage DB) et son cache
# dans un volume : les données survivent aux redémarrages du conteneur.
# NUAGE_URL et NUAGE_TOKEN dans l'environnement les mettent sur un serveur
# Nuage DB à la place.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - donnees:/app/data

volumes:
  donnees:
