name: Vitrine

# Construit la vitrine et verse le résultat dans le dépôt.
#
# Le buildpack Heroku ne compile que la crate Rust : aucun Bun ne tourne sur
# le dyno, donc `vitrine/dist` doit être versionné pour que le serveur ait
# quelque chose à servir. Or ce dépôt se tient depuis un navigateur, sans
# machine de développement — personne ne peut lancer `bun run build` à la
# main. C'est donc ce workflow qui le fait, à chaque changement des sources
# de la vitrine.
#
# Pas de boucle : le déclencheur ne regarde que `vitrine/src` et les fichiers
# de construction, alors que le commit produit ne touche que `vitrine/dist`.

on:
  push:
    branches: [master]
    paths:
      - "vitrine/src/**"
      - "vitrine/index.html"
      - "vitrine/build.tsx"
      - "vitrine/package.json"
      - ".github/workflows/vitrine.yml"
  workflow_dispatch:

# Un seul passage à la fois : deux constructions concurrentes se pousseraient
# mutuellement dans le vide.
concurrency:
  group: vitrine
  cancel-in-progress: false

jobs:
  construire:
    name: Construire et verser dist/
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: vitrine

    steps:
      # Historique complet : l'étape finale rejoue sur la pointe du moment
      # (`pull --rebase`), ce qu'un clone superficiel ne permet pas.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer
        run: bun install --frozen-lockfile

      # Le typage d'abord : une page qui ne compile pas n'a rien à faire en
      # production, et l'échec ici est bien plus lisible qu'un rendu vide.
      - name: Vérifier le typage
        run: bun run verifie

      - name: Construire
        run: bun run build

      # `dist/` est le rendu de `src/` : s'il n'a pas bougé, il n'y a rien à
      # committer et surtout rien à redéployer.
      - name: Verser le résultat
        run: |
          if git diff --quiet -- dist; then
            echo "dist/ inchangé — rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Reconstruit la vitrine

          Rendu de vitrine/src par le CI : le dyno Heroku ne compile que la
          crate Rust, dist/ doit donc être versionné.

          Source : ${GITHUB_SHA}"
          # Rejouer sur la pointe du moment : une autre poussée a pu arriver
          # pendant la construction.
          for essai in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            echo "poussée refusée, nouvelle tentative ($essai)"
            sleep $((essai * 4))
          done
          echo "::error::impossible de pousser dist/ après trois tentatives"
          exit 1
