name: Vitrine

# Construit la vitrine et verse le résultat dans le dépôt.
#
# Le buildpack Heroku ne compile que la crate du serveur : rien ne fabrique
# le WebAssembly sur le dyno, donc `vitrine/dist` doit être versionné pour
# que le serveur ait quelque chose à servir. Or ce dépôt se tient depuis un
# navigateur, sans machine de développement — personne ne peut lancer la
# construction à la main. C'est donc ce workflow qui le fait, à chaque
# changement des sources.
#
# Depuis que la vitrine est en Yew, la chaîne est entièrement Rust : cargo
# pour le WebAssembly, `wasm-bindgen` pour la colle, `wasm-opt` pour la
# taille, et le binaire `construit` pour les coquilles HTML, le plan du site
# et les consignes aux robots. Plus de Bun, plus de Node.
#
# Pas de boucle : le déclencheur ne regarde que les sources, alors que le
# commit produit ne touche que `vitrine/dist`.

on:
  push:
    branches: [master]
    paths:
      - "vitrine/src/**"
      - "vitrine/assets/**"
      - "vitrine/Cargo.toml"
      - ".github/workflows/vitrine.yml"
  workflow_dispatch:

# Un seul passage à la fois : deux constructions concurrentes se pousseraient
# mutuellement dans le vide.
concurrency:
  group: vitrine
  cancel-in-progress: false

jobs:
  construire:
    name: Construire et verser dist/
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: vitrine

    steps:
      # Historique complet : l'étape finale rejoue sur la pointe du moment
      # (`pull --rebase`), ce qu'un clone superficiel ne permet pas.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Chaîne Rust, cible WebAssembly
        run: rustup target add wasm32-unknown-unknown

      # Les trois dossiers qui comptent, dont le binaire de `wasm-bindgen` :
      # le recompiler à chaque passage coûterait plusieurs minutes pour rien.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            vitrine/target
          key: vitrine-${{ runner.os }}-${{ hashFiles('vitrine/Cargo.toml') }}
          restore-keys: vitrine-${{ runner.os }}-

      # La version doit correspondre **exactement** à celle que la crate
      # utilise : le format d'échange entre les deux n'est pas stable, et un
      # décalage fait échouer la liaison avec un message peu parlant.
      - name: wasm-bindgen
        run: |
          attendue=$(cargo tree -i wasm-bindgen --depth 0 2>/dev/null \
            | head -1 | sed 's/.* v//' | cut -d' ' -f1)
          echo "wasm-bindgen attendu : $attendue"
          installee=$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)
          if [ "$installee" != "$attendue" ]; then
            cargo install wasm-bindgen-cli --version "$attendue" --force
          fi

      # `wasm-opt` vient de binaryen. La construction s'en passe s'il manque
      # (elle le dit et livre un WebAssembly plus gros), mais autant l'avoir.
      - name: wasm-opt
        run: npm install -g binaryen

      # Les tests avant la construction : une page qui ne compile pas n'a
      # rien à faire en production, et l'échec ici est bien plus lisible
      # qu'un rendu vide.
      - name: Vérifier
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Construire
        run: cargo run --release --bin construit

      # `dist/` est le rendu de `src/` : s'il n'a pas bougé, il n'y a rien à
      # committer et surtout rien à redéployer.
      - name: Verser le résultat
        run: |
          if git diff --quiet -- dist; then
            echo "dist/ inchangé — rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Reconstruit la vitrine

          Rendu de vitrine/src par le CI : le dyno Heroku ne compile que la
          crate du serveur, dist/ doit donc être versionné.

          Source : ${GITHUB_SHA}"
          # Rejouer sur la pointe du moment : une autre poussée a pu arriver
          # pendant la construction.
          for essai in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            echo "poussée refusée, nouvelle tentative ($essai)"
            sleep $((essai * 4))
          done
          echo "::error::impossible de pousser dist/ après trois tentatives"
          exit 1
