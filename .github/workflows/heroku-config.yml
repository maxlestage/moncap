name: Config Heroku

# Pose sur le serveur les variables qui ne peuvent pas vivre dans le dépôt :
# la liste d'invités (PLUS_OFFERT, dont le compte de review d'Apple) et le
# compte d'envoi de courriel (SMTP_*), repris des secrets du dépôt quand ils
# existent.
#
# Demande un secret HEROKU_API_KEY (sortie de `heroku authorizations:create`).
# Manuel, et en vérification par défaut : rien n'est modifié tant qu'on n'a
# pas choisi `applique` à la main.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verifie (dit ce qui manque) ou applique (pose ce qui manque)"
        type: choice
        default: verifie
        options: [verifie, applique]

jobs:
  config:
    name: Variables du serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Applique
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          # Le jeton des paquets hors ligne. Éprouvé contre GitHub avant
          # d'être posé : un jeton mort ne se voit pas, celui d'avant a
          # laissé le hors ligne hors service des semaines durant.
          GITHUB_TOKEN_PAQUETS: ${{ secrets.GITHUB_TOKEN_PAQUETS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MODE: ${{ inputs.mode }}
        run: |
          python -m pip install --quiet requests
          # `GITHUB_TOKEN` est réservé par Actions (jeton éphémère du run,
          # sans accès aux Releases d'un dépôt privé) : le secret porte donc
          # un autre nom, et on le rend au script sous celui qu'il attend.
          export GITHUB_TOKEN="$GITHUB_TOKEN_PAQUETS"
          python scripts/heroku_config.py
