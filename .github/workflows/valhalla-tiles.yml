name: Tuiles Valhalla

# Produit les tuiles de calcul d'itinéraire et les publie en pièces jointes de
# Release — d'où l'app les téléchargera.
#
# C'est la pièce manquante de la navigation hors ligne : Valhalla sait calculer
# un itinéraire sur l'appareil, mais il lui faut ses propres tuiles routières,
# que personne ne distribue gratuitement (le seul fournisseur prêt à l'emploi
# demande plusieurs centaines de dollars par mois). Un runner GitHub suffit
# pourtant — l'Aquitaine se construit en trois minutes — et les Releases les
# hébergent sans frais.
#
# Manuel uniquement : onglet Actions → Run workflow.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Zones Geofabrik séparées par des virgules (ex. france,portugal) — ou « europe »"
        required: true
        default: europe

permissions:
  contents: write

jobs:
  liste:
    name: Choisir les régions
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.calcule.outputs.matrice }}
    steps:
      - id: calcule
        env:
          DEMANDE: ${{ inputs.regions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys, urllib.request
          from concurrent.futures import ThreadPoolExecutor

          # Le découpage vient de Geofabrik, pas d'une liste tenue à la main :
          # à trois cents zones, une liste recopiée serait fausse au premier
          # changement de leur côté.
          INDEX = "https://download.geofabrik.de/index-v1.json"

          # Au-delà, on descend d'un cran. Une pièce jointe de Release plafonne
          # à 2 Gio, et les tuiles pèsent jusqu'à une fois et demie l'extrait —
          # l'Espagne entière, 1,4 Go, en produisait 2,1. La marge sert aussi
          # au disque du runner et au forfait mobile de qui télécharge.
          SEUIL = 700_000_000

          # Extraits composites de Geofabrik : ils recouvrent des pays déjà
          # listés séparément, et n'ont pas de sous-régions où descendre —
          # « dach » à lui seul fait 6,2 Go.
          DOUBLONS = {"alps", "britain-and-ireland", "dach", "great-britain"}

          with urllib.request.urlopen(INDEX, timeout=180) as r:
              index = json.load(r)

          noeuds, enfants = {}, {}
          for f in index["features"]:
              p = f["properties"]
              pbf = p.get("urls", {}).get("pbf")
              if not pbf or p["id"] in DOUBLONS:
                  continue
              noeuds[p["id"]] = {"nom": p["name"], "parent": p.get("parent"), "pbf": pbf}
              enfants.setdefault(p.get("parent"), []).append(p["id"])

          poids = {}

          def taille(rid):
              if rid not in poids:
                  req = urllib.request.Request(noeuds[rid]["pbf"], method="HEAD")
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          poids[rid] = int(r.headers.get("Content-Length") or 0)
                  except Exception as e:
                      # Taille inconnue : on ne descend pas, et la garde de la
                      # construction rattrapera une archive trop lourde.
                      print(f"HEAD {rid} : {e}", file=sys.stderr)
                      poids[rid] = 0
              return poids[rid]

          def descend(rid, acc):
              fils = enfants.get(rid, [])
              if fils:
                  with ThreadPoolExecutor(8) as ex:
                      list(ex.map(taille, fils))
              if fils and taille(rid) > SEUIL:
                  for f in fils:
                      descend(f, acc)
              elif rid not in acc:
                  acc.append(rid)

          def chemin(rid):
              u = noeuds[rid]["pbf"].split("download.geofabrik.de/", 1)[1]
              return u.rsplit("-latest.osm.pbf", 1)[0]

          def libelle(rid):
              # « France · Rhone-Alpes » : le pays d'abord, pour que l'app
              # puisse regrouper. Geofabrik glisse du HTML dans quelques noms.
              parts, cur = [], rid
              while cur and cur != "europe":
                  parts.append(noeuds[cur]["nom"])
                  cur = noeuds[cur]["parent"]
              propre = [re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", p)).strip() for p in parts]
              return " · ".join(reversed(propre))

          # Groupes bâtis d'un bloc, de plusieurs extraits à la fois.
          #
          # Réunir après coup des tuiles construites séparément ne marche pas,
          # et ce n'est pas qu'une affaire de format : chaque région a coupé ses
          # routes au bord de son extrait, et rien ne les recolle ensuite. Un
          # trajet d'une région à l'autre exige donc un graphe bâti des deux
          # extraits ensemble — mesuré : Bordeaux → Toulouse, 244,9 km, sur un
          # paquet Aquitaine + Midi-Pyrénées de 572 Mo.
          #
          # Le découpage Geofabrik de la France date d'avant 2016 ; ces groupes
          # rendent les treize régions d'aujourd'hui, celles dont on parle.
          REGIONS = {
              "auvergne-rhone-alpes": ("Auvergne-Rhône-Alpes", ["auvergne", "rhone-alpes"]),
              "bourgogne-franche-comte": ("Bourgogne-Franche-Comté",
                                          ["bourgogne", "franche-comte"]),
              "bretagne": ("Bretagne", ["bretagne"]),
              "centre-val-de-loire": ("Centre-Val de Loire", ["centre"]),
              "corse": ("Corse", ["corse"]),
              "grand-est": ("Grand Est", ["alsace", "champagne-ardenne", "lorraine"]),
              "hauts-de-france": ("Hauts-de-France", ["nord-pas-de-calais", "picardie"]),
              "ile-de-france": ("Île-de-France", ["ile-de-france"]),
              "normandie": ("Normandie", ["basse-normandie", "haute-normandie"]),
              "nouvelle-aquitaine": ("Nouvelle-Aquitaine",
                                     ["aquitaine", "limousin", "poitou-charentes"]),
              "occitanie": ("Occitanie", ["languedoc-roussillon", "midi-pyrenees"]),
              "pays-de-la-loire": ("Pays de la Loire", ["pays-de-la-loire"]),
              "provence-alpes-cote-d-azur": ("Provence-Alpes-Côte d'Azur",
                                             ["provence-alpes-cote-d-azur"]),
              "guadeloupe": ("Guadeloupe", ["guadeloupe"]),
              "guyane": ("Guyane", ["guyane"]),
              "martinique": ("Martinique", ["martinique"]),
              "mayotte": ("Mayotte", ["mayotte"]),
              "reunion": ("La Réunion", ["reunion"]),
          }

          # Zones qui se chevauchent, pour les trajets d'une région à l'autre.
          #
          # Une grande région seule ne mène pas loin : Bordeaux → Toulouse en
          # traverse deux. Ces zones se recouvrent donc largement, chacune
          # taillée pour qu'un axe réellement parcouru y tienne en entier.
          #
          # Le plafond de 2 Gio d'une pièce jointe commande le dessin : la
          # France fait 4,2 Go de tuiles, donc aucune zone n'en couvre plus de
          # la moitié. Aller au-delà demanderait de découper une archive en
          # morceaux et de la recoller sur l'appareil — un autre chantier.
          ZONES = {
              "zone-nord-ouest": ("Zone Nord-Ouest", [
                  "bretagne", "pays-de-la-loire", "normandie",
                  "centre-val-de-loire", "ile-de-france", "hauts-de-france"]),
              "zone-nord-est": ("Zone Nord-Est", [
                  "hauts-de-france", "ile-de-france", "grand-est",
                  "bourgogne-franche-comte", "centre-val-de-loire"]),
              "zone-sud": ("Zone Sud", [
                  "nouvelle-aquitaine", "occitanie", "provence-alpes-cote-d-azur",
                  "centre-val-de-loire", "ile-de-france"]),
              "zone-sud-est": ("Zone Sud-Est", [
                  "auvergne-rhone-alpes", "provence-alpes-cote-d-azur", "occitanie",
                  "bourgogne-franche-comte", "corse"]),
              "zone-paris-mediterranee": ("Zone Paris–Méditerranée", [
                  "ile-de-france", "centre-val-de-loire", "bourgogne-franche-comte",
                  "auvergne-rhone-alpes", "provence-alpes-cote-d-azur"]),
              "zone-atlantique-rhone": ("Zone Atlantique–Rhône", [
                  "nouvelle-aquitaine", "centre-val-de-loire", "occitanie",
                  "auvergne-rhone-alpes"]),
          }

          GROUPES = {}
          for cle, (nom, decoupes) in REGIONS.items():
              GROUPES["france-" + cle] = ("France · " + nom, decoupes)
          for cle, (nom, contenu) in ZONES.items():
              decoupes = []
              for r in contenu:
                  for d in REGIONS[r][1]:
                      if d not in decoupes:
                          decoupes.append(d)
              GROUPES["france-" + cle] = ("France · " + nom, decoupes)

          ENSEMBLES = {
              "grandes-regions": ["france-" + c for c in REGIONS],
              "zones": ["france-" + c for c in ZONES],
          }

          alias = {"toutes": "europe", "all": "europe", "": "europe",
                   "espagne": "spain", "allemagne": "germany", "italie": "italy",
                   "portugal": "portugal", "suisse": "switzerland", "belgique": "belgium"}
          demandes = [m.strip().lower() for m in os.environ["DEMANDE"].split(",")]
          demandes = [alias.get(m, m) for m in demandes if m or len(demandes) == 1]
          # Un ensemble se déplie en ses groupes.
          deplie = []
          for d in demandes:
              deplie.extend(ENSEMBLES.get(d, [d]))

          choisies, acc = [], []
          for d in deplie:
              if d in GROUPES:
                  nom, zones = GROUPES[d]
                  choisies.append({
                      "tag": "tuiles-eu-" + d,
                      "nom": nom,
                      "chemins": " ".join(f"europe/france/{z}" for z in zones),
                  })
              elif d in noeuds:
                  descend(d, acc)
              else:
                  print(f"::error::Zone inconnue : « {d} »")
                  raise SystemExit(1)

          choisies += [
              {"tag": "tuiles-eu-" + chemin(r)[len("europe/"):].replace("/", "-"),
               "nom": libelle(r),
               "chemins": chemin(r)}
              for r in acc
          ]

          # Une matrice GitHub plafonne à 256 tâches ; au-delà le lancement
          # échoue en bloc. Mieux vaut le dire, et laisser découper.
          if len(choisies) > 250:
              print(f"::error::{len(choisies)} zones demandées, au-dessus des 250 "
                    "que porte une matrice. Lancer pays par pays.")
              raise SystemExit(1)

          print(f"{len(choisies)} zones", file=sys.stderr)
          print("matrice=" + json.dumps({"region": choisies}))
          PY

  tuiles:
    name: ${{ matrix.region.tag }}
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Une région qui échoue ne doit pas emporter les autres : chacune est
      # publiée indépendamment.
      fail-fast: false
      # À deux cents zones, six de front demanderaient la nuit ; dix tiennent
      # dans ce qu'un dépôt public a droit de lancer en parallèle.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.liste.outputs.matrice) }}
    steps:
      - name: Libère de la place
        # Le disque du runner est en grande partie occupé par des outils dont
        # on n'a aucun usage ici, et la construction écrit beaucoup — l'Espagne
        # part d'un extrait de 1,4 Go.
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Télécharge les extraits OpenStreetMap
        env:
          CHEMINS: ${{ matrix.region.chemins }}
        run: |
          set -euo pipefail
          mkdir -p data
          i=0
          for c in $CHEMINS; do
            i=$((i + 1))
            url="https://download.geofabrik.de/$c-latest.osm.pbf"
            echo "Extrait : $url"
            curl -fSL --retry 4 --retry-delay 5 -o "data/extrait-$i.osm.pbf" "$url"
          done
          ls -lh data/*.osm.pbf

          # Les extraits Geofabrik se chevauchent aux frontières. Passés bruts
          # et en nombre à la construction, les objets en double la font
          # tomber — « Failed tile … vector::_M_range_check », puis abandon.
          # `osmium merge` les réunit en dédupliquant par identifiant, ce que
          # valhalla_build_tiles ne fait pas de lui-même.
          if [ "$i" -gt 1 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq osmium-tool
            osmium merge data/extrait-*.osm.pbf -o data/fusionne.osm.pbf
            rm -f data/extrait-*.osm.pbf
          else
            mv data/extrait-1.osm.pbf data/fusionne.osm.pbf
          fi
          ls -lh data/fusionne.osm.pbf

      - name: Construit les tuiles
        run: |
          set -euo pipefail
          # Le script part sur disque plutôt qu'en ligne. Passé entre
          # apostrophes à `docker run`, la moindre apostrophe dans un
          # commentaire — « d'un coup », « c'est » — referme la chaîne : la
          # commande mutilée sortait alors en succès sans rien construire.
          cat > data/construit.sh <<'SH'
          set -euo pipefail
          valhalla_build_config \
            --mjolnir-tile-dir /data/tuiles \
            --mjolnir-tile-extract /data/tuiles.tar \
            --mjolnir-timezone /data/tuiles/timezones.sqlite \
            --mjolnir-admin /data/tuiles/admins.sqlite > /data/valhalla.json
          mkdir -p /data/tuiles
          # Fuseaux et limites administratives : sans eux les consignes
          # ignorent le pays traversé et le sens de circulation.
          valhalla_build_timezones > /data/tuiles/timezones.sqlite
          # Un seul extrait, fusion des régions du groupe : voilà ce qui
          # raccorde les routes d'une région à l'autre. Construits séparément
          # puis réunis, les jeux de tuiles restent coupés à chaque bord.
          valhalla_build_admins -c /data/valhalla.json /data/fusionne.osm.pbf
          valhalla_build_tiles -c /data/valhalla.json /data/fusionne.osm.pbf
          valhalla_build_extract -c /data/valhalla.json -v
          SH
          # Épinglée sur la version du moteur embarqué par l'app
          # (valhalla-mobile 0.5.1 → Valhalla 3.6.3). Avec `latest`, le
          # générateur prend de l'avance sur le moteur : des clés obligatoires
          # de la configuration changent de nom, et le moteur meurt à
          # l'ouverture du paquet. À monter en même temps que valhalla-mobile,
          # jamais séparément.
          docker run --rm -v "$PWD/data:/data" -w /data \
            ghcr.io/valhalla/valhalla:3.6.3 bash /data/construit.sh
          ls -lh data/tuiles.tar data/valhalla.json
          echo "TAILLE=$(du -h data/tuiles.tar | cut -f1)" >> "$GITHUB_ENV"
          # Une pièce jointe de Release plafonne à 2 Gio ; au-delà l'envoi
          # échoue sur un « 422 Validation Failed » qui ne dit pas pourquoi.
          # Mieux vaut l'annoncer ici, avec le découpage à faire.
          octets=$(stat -c%s data/tuiles.tar)
          if [ "$octets" -ge 2147483648 ]; then
            echo "::error::${{ matrix.region.tag }} produit $TAILLE de tuiles," \
              "au-dessus des 2 Gio d'une pièce jointe de Release." \
              "Découper la région en sous-régions Geofabrik."
            exit 1
          fi

      - name: Annuaire de lieux et limites de vitesse
        # Le même extrait OSM qui a donné les tuiles donne aussi, en un
        # passage : l'annuaire des lieux (les dix-neuf catégories de l'app —
        # pharmacies, campings, restaurants…) et les limites de vitesse
        # explicites, échantillonnées le long des voies. L'app les télécharge
        # avec la région : chercher une pharmacie ou afficher la limite
        # fonctionne alors en mode avion.
        #
        # Best effort : si cette étape échoue, les tuiles partent quand même —
        # l'app sait vivre sans ces deux fichiers, qui sont optionnels.
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          # Un premier filtre réduit l'extrait aux objets utiles : sans lui,
          # l'export GeoJSON d'une région entière pèserait des dizaines de Go.
          osmium tags-filter data/fusionne.osm.pbf -o data/filtre.osm.pbf \
            nwr/amenity=fuel,parking,charging_station,toilets,pharmacy,atm,drinking_water,fast_food,restaurant,bar,cafe,pub,nightclub \
            nwr/shop=supermarket \
            nwr/tourism=camp_site,caravan_site,viewpoint,hotel,guest_house,hostel,attraction,museum \
            nwr/leisure=skatepark,swimming_area,beach_resort,water_park \
            nwr/sport=surfing,skateboard \
            nwr/natural=beach \
            w/maxspeed
          osmium export data/filtre.osm.pbf -f geojsonseq -o data/filtre.geojsonseq
          python3 - <<'PY'
          import json, math, re, struct, zlib

          # Mêmes catégories que POIKind côté app : la clé écrite ici est le
          # rawValue Swift, c'est le contrat entre le fichier et l'app.
          def categorie(t):
              a = t.get("amenity")
              if a == "fuel":
                  return "fuel"
              if a == "parking":
                  cap = t.get("capacity:disabled")
                  if cap and cap not in ("0", "no"):
                      return "parking"
                  return "parkingAll"
              if a == "charging_station":
                  return "charging"
              if a == "toilets":
                  return "toilets"
              if a == "pharmacy":
                  return "pharmacy"
              if a == "atm":
                  return "atm"
              if a == "drinking_water":
                  return "drinkingWater"
              if a == "fast_food":
                  return "fastFood"
              if a == "restaurant":
                  return "restaurant"
              if a in ("bar", "cafe", "pub", "nightclub"):
                  return "hangout"
              if t.get("shop") == "supermarket":
                  return "supermarket"
              to = t.get("tourism")
              if to in ("camp_site", "caravan_site"):
                  return "camping"
              if to == "viewpoint":
                  return "viewpoint"
              if to in ("hotel", "guest_house", "hostel"):
                  return "hotel"
              if to in ("attraction", "museum"):
                  return "tourism"
              if t.get("sport") == "surfing" and not t.get("shop"):
                  return "surf"
              if t.get("surfing") == "yes":
                  return "surf"
              if t.get("leisure") == "skatepark" or t.get("sport") == "skateboard":
                  return "skate"
              if t.get("natural") == "beach" or t.get("leisure") in (
                  "swimming_area", "beach_resort", "water_park"):
                  return "water"
              return None

          def represente(geom):
              # Un point représentatif : le point lui-même, le milieu d'une
              # ligne, la moyenne du contour d'un polygone.
              t, c = geom.get("type"), geom.get("coordinates")
              if t == "Point":
                  return c[1], c[0]
              if t == "LineString":
                  p = c[len(c) // 2]
                  return p[1], p[0]
              ring = None
              if t == "Polygon" and c:
                  ring = c[0]
              elif t == "MultiPolygon" and c and c[0]:
                  ring = c[0][0]
              if ring:
                  return (sum(p[1] for p in ring) / len(ring),
                          sum(p[0] for p in ring) / len(ring))
              return None

          CODES = {"FR:urban": 50, "FR:rural": 80, "FR:motorway": 130,
                   "FR:zone30": 30, "zone30": 30, "FR:walk": 20, "walk": 20}

          def vitesse(brut):
              if brut in CODES:
                  return CODES[brut]
              try:
                  return int(brut)
              except ValueError:
                  pass
              if brut.endswith(" km/h"):
                  try:
                      return int(brut[:-5])
                  except ValueError:
                      return None
              if brut.endswith(" mph"):
                  try:
                      return round(int(brut[:-4]) * 1.609)
                  except ValueError:
                      return None
              return None

          def jalons(coords, pas=120.0):
              # Des points tous les ~120 m le long de la voie : assez denses
              # pour que la position en croise toujours un, assez rares pour
              # que le fichier reste portable.
              out = [coords[0]]
              du = 0.0
              for i in range(1, len(coords)):
                  x0, y0 = coords[i - 1][0], coords[i - 1][1]
                  x1, y1 = coords[i][0], coords[i][1]
                  mlon = 111320.0 * math.cos(math.radians((y0 + y1) / 2))
                  d = math.hypot((x1 - x0) * mlon, (y1 - y0) * 111320.0)
                  while d > 0 and du + d >= pas:
                      f = (pas - du) / d
                      x0, y0 = x0 + (x1 - x0) * f, y0 + (y1 - y0) * f
                      out.append([x0, y0])
                      d -= pas - du
                      du = 0.0
                  du += d
              return out

          lieux, vitesses, nb_v = [], [], 0
          with open("data/filtre.geojsonseq", encoding="utf-8") as f:
              for ligne in f:
                  ligne = ligne.lstrip("\x1e").strip()
                  if not ligne:
                      continue
                  try:
                      feat = json.loads(ligne)
                  except ValueError:
                      continue
                  tags = feat.get("properties") or {}
                  geom = feat.get("geometry") or {}
                  brut = tags.get("maxspeed")
                  if brut and tags.get("highway") and geom.get("type") == "LineString":
                      v = vitesse(brut)
                      if v and 5 <= v <= 200:
                          for x, y in jalons(geom["coordinates"]):
                              vitesses.append(struct.pack(
                                  "<iiB", round(y * 1e5), round(x * 1e5), v))
                              nb_v += 1
                      continue
                  cat = categorie(tags)
                  if not cat:
                      continue
                  p = represente(geom)
                  if not p:
                      continue
                  nom = re.sub(r"\s+", " ", tags.get("name", "")).strip()[:80]
                  lieux.append("%s\t%.5f\t%.5f\t%s" % (cat, p[0], p[1], nom))

          def deflate(donnees):
              # DEFLATE brut (wbits -15) : exactement ce que le cadre
              # Compression d'iOS décode sous le nom COMPRESSION_ZLIB.
              c = zlib.compressobj(9, zlib.DEFLATED, -15)
              return c.compress(donnees) + c.flush()

          if lieux:
              with open("data/lieux.zz", "wb") as f:
                  f.write(deflate("\n".join(lieux).encode("utf-8")))
          if vitesses:
              with open("data/vitesses.zz", "wb") as f:
                  f.write(deflate(b"".join(vitesses)))
          print(f"{len(lieux)} lieux, {nb_v} jalons de vitesse")
          PY
          ls -lh data/lieux.zz data/vitesses.zz || true
          rm -f data/filtre.osm.pbf data/filtre.geojsonseq

      - name: Publie la Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Par l'environnement, et non par interpolation : un nom Geofabrik
          # porte apostrophes et parenthèses, que le shell interpréterait.
          TAG: ${{ matrix.region.tag }}
          NOM: ${{ matrix.region.nom }}
          CHEMINS: ${{ matrix.region.chemins }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv data/tuiles.tar "data/$TAG.tar"
          # La configuration engendrée accompagne les tuiles : elle porte les
          # dizaines de réglages qu'attend Valhalla, qu'il serait absurde de
          # réécrire à la main dans l'app. Seuls les chemins y seront corrigés,
          # l'appareil ne connaissant évidemment pas /data.
          cp data/valhalla.json "data/$TAG.json"
          notes="Tuiles Valhalla · $CHEMINS · $TAILLE · OpenStreetMap (ODbL)"
          # Le titre porte le nom lisible : c'est lui que l'app affiche, elle
          # tire toute sa liste de régions des Releases plutôt que d'une copie
          # embarquée qui vieillirait à chaque construction.
          # `-R` : le dépôt est nommé explicitement, faute de clone local —
          # `gh` le déduit sinon du dossier courant, qui n'est pas un dépôt.
          gh release create "$TAG" -R "$DEPOT" --title "$NOM" --notes "$notes" \
            || gh release edit "$TAG" -R "$DEPOT" --title "$NOM" --notes "$notes"
          # L'annuaire et les vitesses accompagnent les tuiles quand l'étape
          # qui les produit a abouti — l'app les traite comme optionnels.
          fichiers=("data/$TAG.tar" "data/$TAG.json")
          if [ -s data/lieux.zz ]; then
            mv data/lieux.zz "data/$TAG.lieux.zz"
            fichiers+=("data/$TAG.lieux.zz")
          fi
          if [ -s data/vitesses.zz ]; then
            mv data/vitesses.zz "data/$TAG.vitesses.zz"
            fichiers+=("data/$TAG.vitesses.zz")
          fi
          # `--clobber` : reconstruire une région remplace ses tuiles au lieu
          # d'échouer, l'adresse de téléchargement reste donc la même.
          gh release upload "$TAG" "${fichiers[@]}" -R "$DEPOT" --clobber

      - name: Récapitulatif
        env:
          NOM: ${{ matrix.region.nom }}
          CHEMINS: ${{ matrix.region.chemins }}
        run: |
          {
            echo "### $NOM"
            echo ""
            echo "- Zones : \`$CHEMINS\`"
            echo "- Taille : **$TAILLE**"
          } >> "$GITHUB_STEP_SUMMARY"
