name: Tuiles Valhalla

# Produit les tuiles de calcul d'itinéraire et les publie en pièces jointes de
# Release — d'où l'app les téléchargera.
#
# C'est la pièce manquante de la navigation hors ligne : Valhalla sait calculer
# un itinéraire sur l'appareil, mais il lui faut ses propres tuiles routières,
# que personne ne distribue gratuitement (le seul fournisseur prêt à l'emploi
# demande plusieurs centaines de dollars par mois). Un runner GitHub suffit
# pourtant — l'Aquitaine se construit en trois minutes — et les Releases les
# hébergent sans frais.
#
# Manuel uniquement : onglet Actions → Run workflow.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Zones Geofabrik séparées par des virgules (ex. france,portugal) — ou « europe »"
        required: true
        default: europe

permissions:
  contents: write

jobs:
  liste:
    name: Choisir les régions
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.calcule.outputs.matrice }}
    steps:
      - id: calcule
        env:
          DEMANDE: ${{ inputs.regions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys, urllib.request
          from concurrent.futures import ThreadPoolExecutor

          # Le découpage vient de Geofabrik, pas d'une liste tenue à la main :
          # à trois cents zones, une liste recopiée serait fausse au premier
          # changement de leur côté.
          INDEX = "https://download.geofabrik.de/index-v1.json"

          # Au-delà, on descend d'un cran. Une pièce jointe de Release plafonne
          # à 2 Gio, et les tuiles pèsent jusqu'à une fois et demie l'extrait —
          # l'Espagne entière, 1,4 Go, en produisait 2,1. La marge sert aussi
          # au disque du runner et au forfait mobile de qui télécharge.
          SEUIL = 700_000_000

          # Extraits composites de Geofabrik : ils recouvrent des pays déjà
          # listés séparément, et n'ont pas de sous-régions où descendre —
          # « dach » à lui seul fait 6,2 Go.
          DOUBLONS = {"alps", "britain-and-ireland", "dach", "great-britain"}

          with urllib.request.urlopen(INDEX, timeout=180) as r:
              index = json.load(r)

          noeuds, enfants = {}, {}
          for f in index["features"]:
              p = f["properties"]
              pbf = p.get("urls", {}).get("pbf")
              if not pbf or p["id"] in DOUBLONS:
                  continue
              noeuds[p["id"]] = {"nom": p["name"], "parent": p.get("parent"), "pbf": pbf}
              enfants.setdefault(p.get("parent"), []).append(p["id"])

          poids = {}

          def taille(rid):
              if rid not in poids:
                  req = urllib.request.Request(noeuds[rid]["pbf"], method="HEAD")
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          poids[rid] = int(r.headers.get("Content-Length") or 0)
                  except Exception as e:
                      # Taille inconnue : on ne descend pas, et la garde de la
                      # construction rattrapera une archive trop lourde.
                      print(f"HEAD {rid} : {e}", file=sys.stderr)
                      poids[rid] = 0
              return poids[rid]

          def descend(rid, acc):
              fils = enfants.get(rid, [])
              if fils:
                  with ThreadPoolExecutor(8) as ex:
                      list(ex.map(taille, fils))
              if fils and taille(rid) > SEUIL:
                  for f in fils:
                      descend(f, acc)
              elif rid not in acc:
                  acc.append(rid)

          def chemin(rid):
              u = noeuds[rid]["pbf"].split("download.geofabrik.de/", 1)[1]
              return u.rsplit("-latest.osm.pbf", 1)[0]

          def libelle(rid):
              # « France · Rhone-Alpes » : le pays d'abord, pour que l'app
              # puisse regrouper. Geofabrik glisse du HTML dans quelques noms.
              parts, cur = [], rid
              while cur and cur != "europe":
                  parts.append(noeuds[cur]["nom"])
                  cur = noeuds[cur]["parent"]
              propre = [re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", p)).strip() for p in parts]
              return " · ".join(reversed(propre))

          alias = {"toutes": "europe", "all": "europe", "": "europe",
                   "espagne": "spain", "allemagne": "germany", "italie": "italy",
                   "portugal": "portugal", "suisse": "switzerland", "belgique": "belgium"}
          demandes = [m.strip().lower() for m in os.environ["DEMANDE"].split(",")]
          demandes = [alias.get(m, m) for m in demandes if m or len(demandes) == 1]

          acc = []
          for d in demandes:
              if d not in noeuds:
                  print(f"::error::Zone Geofabrik inconnue : « {d} »")
                  raise SystemExit(1)
              descend(d, acc)

          # Une matrice GitHub plafonne à 256 tâches ; au-delà le lancement
          # échoue en bloc. Mieux vaut le dire, et laisser découper.
          if len(acc) > 250:
              print(f"::error::{len(acc)} zones demandées, au-dessus des 250 "
                    "que porte une matrice. Lancer pays par pays.")
              raise SystemExit(1)

          choisies = [
              {"chemin": chemin(r), "tag": "tuiles-eu-" + chemin(r)[len("europe/"):].replace("/", "-"),
               "nom": libelle(r)}
              for r in acc
          ]
          print(f"{len(choisies)} zones", file=sys.stderr)
          print("matrice=" + json.dumps({"region": choisies}))
          PY

  tuiles:
    name: ${{ matrix.region.tag }}
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Une région qui échoue ne doit pas emporter les autres : chacune est
      # publiée indépendamment.
      fail-fast: false
      # À deux cents zones, six de front demanderaient la nuit ; dix tiennent
      # dans ce qu'un dépôt public a droit de lancer en parallèle.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.liste.outputs.matrice) }}
    steps:
      - name: Libère de la place
        # Le disque du runner est en grande partie occupé par des outils dont
        # on n'a aucun usage ici, et la construction écrit beaucoup — l'Espagne
        # part d'un extrait de 1,4 Go.
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Télécharge l'extrait OpenStreetMap
        run: |
          set -euo pipefail
          mkdir -p data
          url="https://download.geofabrik.de/${{ matrix.region.chemin }}-latest.osm.pbf"
          echo "Extrait : $url"
          curl -fSL --retry 4 --retry-delay 5 -o data/extrait.osm.pbf "$url"
          ls -lh data/extrait.osm.pbf

      - name: Construit les tuiles
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/data:/data" -w /data \
            ghcr.io/valhalla/valhalla:latest bash -lc '
              set -euo pipefail
              valhalla_build_config \
                --mjolnir-tile-dir /data/tuiles \
                --mjolnir-tile-extract /data/tuiles.tar \
                --mjolnir-timezone /data/tuiles/timezones.sqlite \
                --mjolnir-admin /data/tuiles/admins.sqlite > /data/valhalla.json
              mkdir -p /data/tuiles
              # Fuseaux et limites administratives : sans eux les consignes
              # ignorent le pays traversé et le sens de circulation.
              valhalla_build_timezones > /data/tuiles/timezones.sqlite
              valhalla_build_admins -c /data/valhalla.json /data/extrait.osm.pbf
              valhalla_build_tiles -c /data/valhalla.json /data/extrait.osm.pbf
              valhalla_build_extract -c /data/valhalla.json -v
            '
          ls -lh data/tuiles.tar data/valhalla.json
          echo "TAILLE=$(du -h data/tuiles.tar | cut -f1)" >> "$GITHUB_ENV"
          # Une pièce jointe de Release plafonne à 2 Gio ; au-delà l'envoi
          # échoue sur un « 422 Validation Failed » qui ne dit pas pourquoi.
          # Mieux vaut l'annoncer ici, avec le découpage à faire.
          octets=$(stat -c%s data/tuiles.tar)
          if [ "$octets" -ge 2147483648 ]; then
            echo "::error::${{ matrix.region.chemin }} produit $TAILLE de tuiles," \
              "au-dessus des 2 Gio d'une pièce jointe de Release." \
              "Découper la région en sous-régions Geofabrik."
            exit 1
          fi

      - name: Publie la Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Par l'environnement, et non par interpolation : un nom Geofabrik
          # porte apostrophes et parenthèses, que le shell interpréterait.
          TAG: ${{ matrix.region.tag }}
          NOM: ${{ matrix.region.nom }}
          CHEMIN: ${{ matrix.region.chemin }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv data/tuiles.tar "data/$TAG.tar"
          # La configuration engendrée accompagne les tuiles : elle porte les
          # dizaines de réglages qu'attend Valhalla, qu'il serait absurde de
          # réécrire à la main dans l'app. Seuls les chemins y seront corrigés,
          # l'appareil ne connaissant évidemment pas /data.
          cp data/valhalla.json "data/$TAG.json"
          notes="Tuiles Valhalla · $CHEMIN · $TAILLE · OpenStreetMap (ODbL)"
          # Le titre porte le nom lisible : c'est lui que l'app affiche, elle
          # tire toute sa liste de régions des Releases plutôt que d'une copie
          # embarquée qui vieillirait à chaque construction.
          # `-R` : le dépôt est nommé explicitement, faute de clone local —
          # `gh` le déduit sinon du dossier courant, qui n'est pas un dépôt.
          gh release create "$TAG" -R "$DEPOT" --title "$NOM" --notes "$notes" \
            || gh release edit "$TAG" -R "$DEPOT" --title "$NOM" --notes "$notes"
          # `--clobber` : reconstruire une région remplace ses tuiles au lieu
          # d'échouer, l'adresse de téléchargement reste donc la même.
          gh release upload "$TAG" "data/$TAG.tar" "data/$TAG.json" -R "$DEPOT" --clobber

      - name: Récapitulatif
        env:
          NOM: ${{ matrix.region.nom }}
          CHEMIN: ${{ matrix.region.chemin }}
        run: |
          {
            echo "### $NOM"
            echo ""
            echo "- Zone : \`$CHEMIN\`"
            echo "- Taille : **$TAILLE**"
          } >> "$GITHUB_STEP_SUMMARY"
