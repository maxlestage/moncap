name: Xcode Cloud off

# Coupe les workflows Xcode Cloud du compte (via l'API App Store Connect).
# Un pipeline Xcode Cloud « à chaque poussée » tournait en parallèle de la
# CI GitHub avec son propre compteur de builds (119, 120…) : ses envois
# TestFlight masquaient les nôtres et chaque merge payait deux
# constructions. Manuel uniquement — et réactivable d'un clic dans App
# Store Connect si besoin.

on:
  workflow_dispatch:

jobs:
  couper:
    name: Désactiver les workflows Xcode Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Couper
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python -m pip install --quiet requests "pyjwt[crypto]"
          python frontend/scripts/xcode_cloud_off.py
