name: CI

# Plus aucun déclenchement automatique sur push : lancement uniquement à la
# main (onglet Actions → Run workflow).
on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    # Postgres jetable pour les tests d'intégration (handlers HTTP + auth + DB).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moncap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Éditeur de liens mold : temps de link nettement réduit (utile sur ce
      # projet aux nombreuses dépendances). `make-default` le rend transparent,
      # sans avoir à toucher aux RUSTFLAGS.
      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # TEST_DATABASE_URL active les tests d'intégration ; sans lui ils se
      # skippent proprement (utile en local sans base).
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moncap_test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

  traductions:
    name: Traductions (iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Aucun de ces défauts ne fait échouer la compilation : une chaîne non
      # traduite s'affiche simplement en français, et rien ne proteste. Ils
      # ont tous été trouvés à la main une fois — ce job évite de recommencer.
      - name: Vérifie le catalogue et les sites d'appel
        run: python3 frontend/traductions.py --verifie

      # Le catalogue et le module de la vitrine sont engendrés : s'ils ne
      # correspondent plus au tableau, c'est qu'on a modifié l'un sans l'autre.
      - name: Vérifie que les fichiers engendrés sont à jour
        run: |
          python3 frontend/traductions.py
          if ! git diff --quiet; then
            echo "::error::fichiers engendrés obsolètes — relancer frontend/traductions.py"
            git diff --stat
            exit 1
          fi
          echo "fichiers engendrés à jour"

  audit:
    name: Security audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Binaire prébuilt de cargo-audit (pas de compilation → rapide).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Vérifie Cargo.lock contre la base d'avis de sécurité RustSec.
      #
      # Chaque exception est motivée et vérifiée, pas subie. Le job échoue sur
      # tout autre avis, et sur ceux-ci dès qu'une version corrigée paraît —
      # `cargo audit` ne se tait que pour les identifiants nommés ici.
      #
      # RUSTSEC-2023-0071 (Marvin, `rsa`) — aucune version corrigée en amont.
      #   Tirée par sqlx pour la poignée de main Postgres, côté client vers une
      #   base de confiance : pas une surface exposée à un attaquant ici.
      #
      # RUSTSEC-2026-0235 (`rkyv`, lecture hors bornes) — corrigée en 0.8.17,
      #   mais `rust_decimal` la borne en 0.7.x. Sans effet malgré tout :
      #   `cargo tree --target all` ne la trouve **pas** dans le graphe
      #   compilé, c'est une dépendance optionnelle jamais activée. Et l'app
      #   ne désarchive aucune donnée rkyv.
      #
      # RUSTSEC-2026-0173 (`proc-macro-error2`, non maintenue) — macro de
      #   compilation tirée par sea-orm ; elle ne part pas dans le binaire.
      #
      # RUSTSEC-2025-0134 (`rustls-pemfile`, non maintenue) — tirée par redis.
      #   Signalement d'abandon, pas de faille : rien à corriger tant qu'un
      #   avis de vulnérabilité n'est pas publié.
      - name: Audit dependencies
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2025-0134
