name: Fusion de tuiles

# Vérifie qu'on peut router à travers deux régions en fusionnant leurs
# archives de tuiles.
#
# L'app ne garde aujourd'hui qu'une région : Bordeaux → Toulouse hors réseau
# est hors de portée, l'Aquitaine ignorant les routes de Midi-Pyrénées. Avant
# d'écrire ce mécanisme dans l'app — où il ne se teste qu'au bout d'un cycle
# TestFlight — on l'éprouve ici, où Valhalla est installé.
#
# Deux voies ont été essayées et écartées, mesures à l'appui :
#   — prolonger une archive avec `tar -A` : les 254 membres étaient bien là,
#     Valhalla n'en chargeait que 120, soit la première archive seule ;
#   — réunir les tuiles dans un dossier et pointer `tile_dir` dessus : le
#     service démarre mais ne trouve aucune arête, y compris à l'intérieur
#     d'une seule région, racine des tuiles pourtant relevée et correcte.
#
# Reste la voie que Valhalla soutient vraiment : construire **un seul graphe**
# à partir des deux extraits OpenStreetMap. C'est la seule qui garantisse la
# continuité à la frontière — l'union de tuiles construites séparément ne
# l'aurait de toute façon jamais assurée, chaque région ayant coupé ses routes
# au bord.
#
# Quatre épreuves, dans cet ordre :
#   1. un trajet interne à l'Aquitaine, pour établir que l'archive publiée et
#      la configuration corrigée suffisent à router ;
#   2. le même Bordeaux → Toulouse avec la seule Aquitaine, qui doit échouer —
#      sans quoi les suivantes ne prouveraient rien ;
#   3. le dossier réunissant les deux régions, gardé pour trace ;
#   4. Bordeaux → Toulouse sur un graphe construit des deux extraits.

on:
  workflow_dispatch:

jobs:
  fusion:
    name: Router d'une région à l'autre
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupère deux régions voisines
        run: |
          set -euo pipefail
          mkdir -p data
          base=https://github.com/maxlestage/moncap/releases/download
          for r in france-aquitaine france-midi-pyrenees; do
            curl -fSL --retry 4 -o "data/$r.tar" "$base/tuiles-eu-$r/tuiles-eu-$r.tar"
          done
          curl -fSL --retry 4 -o data/brut.json \
            "$base/tuiles-eu-france-aquitaine/tuiles-eu-france-aquitaine.json"
          ls -lh data/

      - name: Réunit les régions dans un dossier de tuiles
        run: |
          set -euo pipefail
          # Prolonger une archive avec `tar -A` a été essayé et ne marche pas :
          # les 254 membres étaient bien là, mais Valhalla n'en chargeait que
          # 120 — la première archive, et rien après son terminateur.
          #
          # Valhalla sait lire un dossier de tuiles aussi bien qu'une archive,
          # et c'est la voie propre : les tuiles frontalières présentes dans
          # les deux régions s'écrasent au lieu de se dupliquer.
          mkdir -p data/tuiles
          for r in france-aquitaine france-midi-pyrenees; do
            echo "$r : $(tar -tf "data/$r.tar" | grep -c '\.gph$' || true) tuiles"
            # Sous quel chemin ? L'essai précédent l'a supposé au lieu de le
            # regarder, et c'est très probablement là qu'il a buté.
            echo "  premiers membres : $(tar -tf "data/$r.tar" | head -3 | tr '\n' ' ')"
            tar -xf "data/$r.tar" -C data/tuiles
          done
          echo "dossier : $(find data/tuiles -name '*.gph' | wc -l) tuiles"

          # La racine des tuiles est le parent du dossier de niveau (0 à 3),
          # où qu'il se trouve : l'archive peut porter un préfixe de chemin.
          niveau=$(find data/tuiles -type d -regex '.*/[0-3]$' \
            | awk -F/ '{print NF, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          racine=$(dirname "$niveau")
          echo "racine des tuiles : $racine"
          ls "$racine"
          # Le dossier est monté sur /data dans le conteneur.
          echo "RACINE=${racine#data/}" >> "$GITHUB_ENV"
          du -sh data/tuiles

      - name: Prépare les configurations
        run: |
          set -euo pipefail
          # Exactement la correction que fait l'app : seul le chemin de
          # l'archive change, le reste des réglages est celui de Valhalla.
          python3 - <<'PY'
          import json, os

          brut = json.load(open("data/brut.json"))
          racine = os.environ["RACINE"]

          def config(sortie, archive=None, dossier=None):
              conf = json.loads(json.dumps(brut))
              m = conf["mjolnir"]
              for cle in ("tile_extract", "tile_dir", "admin", "timezone"):
                  m.pop(cle, None)
              if archive:
                  m["tile_extract"] = f"/data/{archive}"
              if dossier:
                  m["tile_dir"] = f"/data/{dossier}"
              json.dump(conf, open(sortie, "w"))

          # Une région, telle que l'app la lit aujourd'hui.
          config("data/seule.json", archive="france-aquitaine.tar")
          # Deux régions réunies dans un dossier, à la racine relevée.
          config("data/dossier.json", dossier=racine)
          PY
          ls -l data/seule.json data/dossier.json

      - name: Construit un graphe commun aux deux régions
        run: |
          set -euo pipefail
          # Les deux extraits OpenStreetMap, passés ensemble à la construction :
          # `valhalla_build_tiles` accepte plusieurs fichiers et n'en fait qu'un
          # graphe. C'est ce qui raccorde réellement les routes à la frontière,
          # là où deux jeux de tuiles construits séparément les auraient
          # coupées chacun de son côté.
          for r in aquitaine midi-pyrenees; do
            curl -fSL --retry 4 -o "data/$r.osm.pbf" \
              "https://download.geofabrik.de/europe/france/$r-latest.osm.pbf"
          done
          ls -lh data/*.osm.pbf

          docker run --rm -v "$PWD/data:/data" -w /data \
            ghcr.io/valhalla/valhalla:latest bash -lc '
              set -euo pipefail
              valhalla_build_config \
                --mjolnir-tile-dir /data/commun \
                --mjolnir-tile-extract /data/commun.tar \
                --mjolnir-timezone /data/commun/timezones.sqlite \
                --mjolnir-admin /data/commun/admins.sqlite > /data/commun-brut.json
              mkdir -p /data/commun
              valhalla_build_timezones > /data/commun/timezones.sqlite
              valhalla_build_admins -c /data/commun-brut.json \
                /data/aquitaine.osm.pbf /data/midi-pyrenees.osm.pbf
              valhalla_build_tiles -c /data/commun-brut.json \
                /data/aquitaine.osm.pbf /data/midi-pyrenees.osm.pbf
              valhalla_build_extract -c /data/commun-brut.json -v
            '
          ls -lh data/commun.tar
          echo "tuiles du graphe commun : $(tar -tf data/commun.tar | grep -c '\.gph$' || true)"
          echo "COMMUN=$(du -h data/commun.tar | cut -f1)" >> "$GITHUB_ENV"

          # Même correction que l'app, sur la configuration engendrée ici.
          python3 - <<'PY'
          import json

          racine = json.load(open("data/commun-brut.json"))
          m = racine["mjolnir"]
          for cle in ("tile_dir", "admin", "timezone"):
              m.pop(cle, None)
          m["tile_extract"] = "/data/commun.tar"
          json.dump(racine, open("data/commun.json", "w"))
          PY

      - name: Écrit les demandes et le script d'épreuve
        # Sur disque, et non en ligne : un script Python dans un heredoc dans
        # une commande docker entre apostrophes, c'est trois niveaux de
        # guillemets, et le premier essai s'y est cassé les dents.
        run: |
          set -euo pipefail
          # Bordeaux et Arcachon sont tous deux en Aquitaine ; Toulouse est en
          # Midi-Pyrénées, à deux cent quarante kilomètres et de l'autre côté
          # de la frontière régionale.
          cat > data/interne.json <<'JSON'
          {"locations":[{"lat":44.8378,"lon":-0.5792},{"lat":44.6580,"lon":-1.1680}],
           "costing":"auto","directions_options":{"units":"kilometers"}}
          JSON
          cat > data/traverse.json <<'JSON'
          {"locations":[{"lat":44.8378,"lon":-0.5792},{"lat":43.6047,"lon":1.4442}],
           "costing":"auto","directions_options":{"units":"kilometers"}}
          JSON

          cat > data/resume.py <<'PY'
          import json, sys

          try:
              reponse = json.load(open(sys.argv[1]))
          except Exception as erreur:
              print("  illisible :", erreur)
              raise SystemExit(1)
          resume = reponse.get("trip", {}).get("summary")
          if not resume:
              print("  pas d itineraire :", json.dumps(reponse)[:300])
              raise SystemExit(1)
          print("  %.1f km, %.0f min" % (resume["length"], resume["time"] / 60))
          PY

          # Valhalla n'expose plus le calcul en ligne de commande : les
          # versions récentes n'embarquent que `valhalla_service`, qui répond
          # en HTTP. On l'interroge donc par la boucle locale.
          cat > data/poste.py <<'PY'
          import sys, urllib.error, urllib.request

          corps = open(sys.argv[1], "rb").read()
          demande = urllib.request.Request(
              "http://127.0.0.1:8002/route", data=corps,
              headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(demande, timeout=300) as reponse:
                  brut = reponse.read()
          except urllib.error.HTTPError as erreur:
              # Un refus de Valhalla arrive en 400 avec un corps explicite :
              # c'est justement ce qu'on veut lire au contrôle négatif.
              brut = erreur.read()
          except Exception as erreur:
              brut = ('{"erreur": "%s"}' % erreur).encode()
          open(sys.argv[2], "wb").write(brut)
          PY

          cat > data/attend.py <<'PY'
          import socket, sys, time

          limite = time.monotonic() + 180
          while time.monotonic() < limite:
              prise = socket.socket()
              prise.settimeout(2)
              if prise.connect_ex(("127.0.0.1", 8002)) == 0:
                  prise.close()
                  raise SystemExit(0)
              prise.close()
              time.sleep(1)
          raise SystemExit(1)
          PY

          cat > data/epreuve.sh <<'SH'
          set -uo pipefail

          lance() {  # $1 configuration
            valhalla_service "$1" 1 > /data/service.log 2>&1 &
            SERVICE=$!
            if ! python3 /data/attend.py; then
              echo "  le service n a pas repondu"
              cat /data/service.log
              return 1
            fi
          }

          arrete() {
            kill "$SERVICE" 2> /dev/null || true
            wait "$SERVICE" 2> /dev/null || true
            # Le port doit être libre avant le service suivant.
            sleep 2
          }

          trajet() {  # $1 demande, $2 sortie
            python3 /data/poste.py "$1" "$2"
          }

          echo "== 1. Bordeaux -> Arcachon, Aquitaine seule (doit aboutir)"
          lance /data/seule.json || exit 1
          trajet /data/interne.json /data/r1.json
          if ! python3 /data/resume.py /data/r1.json; then
            echo "ECHEC : la region seule ne route pas"
            cat /data/service.log
            arrete
            exit 1
          fi

          echo "== 2. Bordeaux -> Toulouse, Aquitaine seule (doit echouer)"
          trajet /data/traverse.json /data/r2.json
          if python3 /data/resume.py /data/r2.json > /dev/null 2>&1; then
            echo "INATTENDU : la region seule a route jusqua Toulouse."
            echo "Le controle negatif tombe, l epreuve suivante ne prouverait rien."
            python3 /data/resume.py /data/r2.json
            arrete
            exit 1
          fi
          echo "  refuse, comme attendu"
          arrete

          echo "== 3. Bordeaux -> Toulouse, dossier des deux regions (doit aboutir)"
          lance /data/dossier.json || exit 1
          # Bordeaux d abord : si lui-meme ne repond plus, c est le dossier qui
          # est en cause, et non la couture entre les deux regions.
          trajet /data/interne.json /data/r3a.json
          if python3 /data/resume.py /data/r3a.json; then
            trajet /data/traverse.json /data/r3.json
            python3 /data/resume.py /data/r3.json || echo "  ne traverse pas"
          else
            # Connu et mesuré : gardé pour trace, sans faire tomber l epreuve,
            # la voie retenue est la construction commune.
            echo "  le dossier ne route pas — journal complet du service :"
            cat /data/service.log
          fi
          arrete

          echo "== 4. Bordeaux -> Toulouse, graphe construit des deux extraits"
          lance /data/commun.json || exit 1
          trajet /data/interne.json /data/r4a.json
          if ! python3 /data/resume.py /data/r4a.json; then
            echo "ECHEC : le graphe commun ne route pas dans une seule region"
            cat /data/service.log
            arrete
            exit 1
          fi
          trajet /data/traverse.json /data/r4.json
          if ! python3 /data/resume.py /data/r4.json; then
            echo "ECHEC : le graphe commun ne traverse pas la frontiere"
            cat /data/service.log
            arrete
            exit 1
          fi
          arrete
          SH

      - name: Éprouve les quatre trajets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/data:/data" -w /data \
            ghcr.io/valhalla/valhalla:latest bash /data/epreuve.sh

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### Fusion de tuiles"
            echo ""
            echo "Aquitaine + Midi-Pyrénées, Bordeaux → Toulouse."
            echo "Le détail des trois épreuves est dans le journal de l'étape précédente."
          } >> "$GITHUB_STEP_SUMMARY"
