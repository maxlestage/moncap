name: Épreuve d'itinéraire hors ligne

# Vérifie sur un paquet publié que l'app pourra bien calculer un itinéraire
# sans réseau — et qu'un trajet traverse l'intérieur du paquet.
#
# Ce que l'épreuve garde en mémoire, appris à ses dépens : réunir après coup
# des tuiles construites séparément ne marche pas. Ni en prolongeant l'archive
# (254 membres, 120 chargés), ni par un dossier commun (aucune arête trouvée).
# Chaque extrait coupe ses routes au bord, et rien ne les recolle ensuite ;
# seul un graphe bâti de plusieurs extraits ensemble les raccorde.
#
# D'où le regroupement en grandes régions, et d'où cette vérification :
# Bordeaux → Limoges passe l'ancienne couture Aquitaine / Limousin, désormais
# à l'intérieur du seul paquet Nouvelle-Aquitaine. Si le regroupement se
# défaisait, ce trajet serait le premier à tomber.
#
# Le contrôle négatif compte autant : Toulouse est hors du paquet et doit être
# refusé, sinon le succès du premier trajet ne prouverait rien.

on:
  workflow_dispatch:
  schedule:
    # Une fois par semaine : les paquets sont reconstruits à la demande, et
    # une régression silencieuse ne se verrait qu'au moment d'en avoir besoin.
    - cron: "17 5 * * 1"

jobs:
  epreuve:
    name: Router sans réseau sur un paquet publié
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupère le paquet publié
        run: |
          set -euo pipefail
          mkdir -p data
          base=https://github.com/maxlestage/moncap/releases/download
          tag=tuiles-eu-france-nouvelle-aquitaine
          curl -fSL --retry 4 -o data/paquet.tar "$base/$tag/$tag.tar"
          curl -fSL --retry 4 -o data/brut.json "$base/$tag/$tag.json"
          ls -lh data/

      - name: Écrit la configuration et les scripts
        run: |
          set -euo pipefail
          # La même correction que fait l'app : seuls les chemins changent,
          # les dizaines de réglages de Valhalla sont conservés tels quels.
          python3 - <<'PY'
          import json

          racine = json.load(open("data/brut.json"))
          m = racine["mjolnir"]
          for cle in ("tile_dir", "admin", "timezone"):
              m.pop(cle, None)
          m["tile_extract"] = "/data/paquet.tar"
          json.dump(racine, open("data/config.json", "w"))
          PY

          # Bordeaux et Limoges sont tous deux en Nouvelle-Aquitaine, mais de
          # part et d'autre de l'ancienne frontière Aquitaine / Limousin.
          cat > data/interne.json <<'JSON'
          {"locations":[{"lat":44.8378,"lon":-0.5792},{"lat":45.8336,"lon":1.2611}],
           "costing":"auto","directions_options":{"units":"kilometers"}}
          JSON
          # Toulouse est en Occitanie, donc hors du paquet.
          cat > data/dehors.json <<'JSON'
          {"locations":[{"lat":44.8378,"lon":-0.5792},{"lat":43.6047,"lon":1.4442}],
           "costing":"auto","directions_options":{"units":"kilometers"}}
          JSON

          cat > data/resume.py <<'PY'
          import json, sys

          try:
              reponse = json.load(open(sys.argv[1]))
          except Exception as erreur:
              print("  illisible :", erreur)
              raise SystemExit(1)
          resume = reponse.get("trip", {}).get("summary")
          if not resume:
              print("  pas d itineraire :", json.dumps(reponse)[:300])
              raise SystemExit(1)
          km = resume["length"]
          print("  %.1f km, %.0f min" % (km, resume["time"] / 60))
          # Un itineraire absurde repondrait quand meme : Bordeaux - Limoges
          # fait environ 220 km par la route, la fourchette le dit.
          if len(sys.argv) > 2 and not (150 <= km <= 400):
              print("  distance hors de tout bon sens")
              raise SystemExit(1)
          PY

          # Valhalla ne route plus qu'en HTTP : les versions récentes
          # n'embarquent que `valhalla_service`.
          cat > data/poste.py <<'PY'
          import sys, urllib.error, urllib.request

          demande = urllib.request.Request(
              "http://127.0.0.1:8002/route",
              data=open(sys.argv[1], "rb").read(),
              headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(demande, timeout=300) as reponse:
                  brut = reponse.read()
          except urllib.error.HTTPError as erreur:
              # Un refus arrive en 400 avec un corps explicite : c'est ce que
              # le contrôle négatif veut lire.
              brut = erreur.read()
          except Exception as erreur:
              brut = ('{"erreur": "%s"}' % erreur).encode()
          open(sys.argv[2], "wb").write(brut)
          PY

          cat > data/attend.py <<'PY'
          import socket, time

          limite = time.monotonic() + 180
          while time.monotonic() < limite:
              prise = socket.socket()
              prise.settimeout(2)
              joignable = prise.connect_ex(("127.0.0.1", 8002)) == 0
              prise.close()
              if joignable:
                  raise SystemExit(0)
              time.sleep(1)
          raise SystemExit(1)
          PY

          cat > data/epreuve.sh <<'SH'
          set -uo pipefail

          valhalla_service /data/config.json 1 > /data/service.log 2>&1 &
          SERVICE=$!
          if ! python3 /data/attend.py; then
            echo "ECHEC : le service n a pas repondu"
            cat /data/service.log
            exit 1
          fi

          echo "== Bordeaux -> Limoges, dans le paquet (doit aboutir)"
          python3 /data/poste.py /data/interne.json /data/dedans.json
          if ! python3 /data/resume.py /data/dedans.json --borne; then
            echo "ECHEC : le paquet ne traverse pas son propre territoire"
            cat /data/service.log
            kill "$SERVICE" 2> /dev/null
            exit 1
          fi

          echo "== Bordeaux -> Toulouse, hors du paquet (doit echouer)"
          python3 /data/poste.py /data/dehors.json /data/hors.json
          if python3 /data/resume.py /data/hors.json > /dev/null 2>&1; then
            echo "INATTENDU : un point hors du paquet a ete route."
            echo "Le controle negatif tombe, le premier trajet ne prouve rien."
            kill "$SERVICE" 2> /dev/null
            exit 1
          fi
          echo "  refuse, comme attendu"
          kill "$SERVICE" 2> /dev/null
          SH

      - name: Éprouve les deux trajets
        run: |
          set -euo pipefail
          # Épinglée sur la version du moteur embarqué par l'app
          # (valhalla-mobile 0.5.1 → Valhalla 3.6.3). Avec `latest`, le
          # générateur prend de l'avance sur le moteur : des clés obligatoires
          # de la configuration changent de nom, et le moteur meurt à
          # l'ouverture du paquet. À monter en même temps que valhalla-mobile,
          # jamais séparément.
          docker run --rm -v "$PWD/data:/data" -w /data \
            ghcr.io/valhalla/valhalla:3.9.1 bash /data/epreuve.sh
