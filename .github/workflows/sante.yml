name: Santé de la production

# Demande à la production si elle rend ses services — pas seulement si elle
# répond. Le keep-alive interrogeait `/health`, qui disait 200 pendant que le
# courtier de paquets hors ligne rendait 502 depuis des semaines : le jeton
# GitHub du serveur avait expiré, et rien ne le disait.
#
# Aucun secret : tout ce qui est éprouvé ici est public, comme l'application
# le voit. C'est ce qui permet de le lancer même quand on n'a plus les clés.

on:
  workflow_dispatch:
  schedule:
    # Une fois par jour. Les pannes visées ici ne sont pas des hoquets de
    # quelques minutes mais des jetons qui meurent et des dépendances qui
    # disparaissent — un passage quotidien les attrape largement à temps,
    # sans encombrer la file des runners.
    - cron: "17 6 * * *"

jobs:
  sante:
    name: Services rendus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Interroge la production
        run: |
          python -m pip install --quiet requests
          python scripts/sante.py
